// Force patched versions of vulnerable transitive deps on the buildscript
// (Gradle plugin) classpath. These are build-tooling libs pulled in by the
// Loom/Architectury/Shadow plugins; they are not shipped in the mod JAR.
buildscript {
    configurations.all {
        resolutionStrategy {
            force 'org.apache.commons:commons-text:1.15.0'
            force 'commons-beanutils:commons-beanutils:1.11.0'
            force 'org.codehaus.plexus:plexus-utils:3.6.1'
            force 'org.apache.commons:commons-compress:1.26.0'
        }
    }
}

plugins {
    id 'dev.architectury.loom' version '1.9-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def requiredProp = { String key, String fallback = null ->
    def value = findProperty(key)?.toString()
    if (value != null && !value.isBlank()) {
        return value
    }
    if (fallback != null) {
        return fallback
    }
    throw new GradleException("Missing required Gradle property '${key}'")
}

ext.targetMc = "1.20.1"
ext.selectedJavaVersion = Integer.parseInt(requiredProp("java_version", "17"))
ext.selectedMinecraftVersion = requiredProp("minecraft_version", "1.20.1")
ext.selectedYarnMappings = requiredProp("yarn_mappings")
ext.selectedArchitecturyVersion = requiredProp("architectury_api_version")
ext.selectedFabricLoaderVersion = requiredProp("fabric_loader_version")
ext.selectedFabricApiVersion = requiredProp("fabric_api_version")
ext.selectedForgeVersion = requiredProp("forge_version")
ext.selectedVoicechatModrinthVersion = requiredProp("voicechat_modrinth_version")
ext.selectedPlasmoVoiceModrinthVersion = requiredProp("plasmo_voice_modrinth_version")
def forgeLoaderToken = ext.selectedForgeVersion.tokenize('-').size() > 1
        ? ext.selectedForgeVersion.tokenize('-')[1]
        : ""
if (forgeLoaderToken.isBlank()) {
    throw new GradleException("Could not extract Forge loader version from forge_version='${ext.selectedForgeVersion}'")
}
ext.selectedForgeLoaderMajor = forgeLoaderToken.tokenize('.')[0]

println "CatSkinC profile: minecraft=${ext.selectedMinecraftVersion}, java=${ext.selectedJavaVersion}"

architectury {
    minecraft = rootProject.ext.selectedMinecraftVersion
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    def hardenBuild = (rootProject.findProperty("harden_build")?.toString()?.toBoolean() ?: true)

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://maven.maxhenkel.de/repository/public" }
        maven { url "https://repo.plasmoverse.com/releases" }
        maven {
            url "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }

    // Security hardening: force patched versions of transitive dependencies that
    // Dependabot flags as vulnerable. These are Minecraft-provided runtime libs
    // (netty, log4j, guava, commons-*) that are NOT bundled into the shipped mod
    // JAR, but forcing the patched versions keeps the dev runtime and CI clean.
    configurations.all {
        resolutionStrategy {
            // Netty (GHSA-558v-64gr-wgg4 and related) -> 4.1.136.Final
            force 'io.netty:netty-buffer:4.1.136.Final'
            force 'io.netty:netty-codec:4.1.136.Final'
            force 'io.netty:netty-common:4.1.136.Final'
            force 'io.netty:netty-handler:4.1.136.Final'
            force 'io.netty:netty-resolver:4.1.136.Final'
            force 'io.netty:netty-transport:4.1.136.Final'
            force 'io.netty:netty-transport-classes-epoll:4.1.136.Final'
            force 'io.netty:netty-transport-native-epoll:4.1.136.Final'
            force 'io.netty:netty-transport-native-unix-common:4.1.136.Final'
            // Log4j -> 2.25.5 (CVE-2026-49844, CVE-2026-34477, CVE-2026-34480, CVE-2025-68161)
            force 'org.apache.logging.log4j:log4j-api:2.25.5'
            force 'org.apache.logging.log4j:log4j-core:2.25.5'
            force 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.5'
            // Plexus Utils -> 3.6.1 (CVE-2025-67030 directory traversal)
            force 'org.codehaus.plexus:plexus-utils:3.6.1'
            // Guava -> 32.0.0-jre
            force 'com.google.guava:guava:32.0.0-jre'
            // Commons IO -> 2.16.1 (CVE-2024-47554)
            force 'commons-io:commons-io:2.16.1'
            // Commons Compress -> 1.26.0 (CVE-2024-25710, CVE-2024-26308)
            force 'org.apache.commons:commons-compress:1.26.0'
            // Commons Lang3 -> 3.18.0 (CVE-2025-48924 uncontrolled recursion)
            force 'org.apache.commons:commons-lang3:3.18.0'
            // Commons BeanUtils -> 1.11.0 (CVE-2025-48734)
            force 'commons-beanutils:commons-beanutils:1.11.0'
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.ext.selectedMinecraftVersion"
        mappings "net.fabricmc:yarn:$rootProject.ext.selectedYarnMappings:v2"
    }

    java {
        withSourcesJar()
        def selectedJava = JavaVersion.toVersion(rootProject.ext.selectedJavaVersion)
        sourceCompatibility = selectedJava
        targetCompatibility = selectedJava
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = rootProject.ext.selectedJavaVersion
        options.encoding = "UTF-8"
        if (hardenBuild) {
            options.debug = false
            options.compilerArgs += ['-g:none']
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
